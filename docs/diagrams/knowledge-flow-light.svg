 L334,346" fill="none" stroke="#8E9BA1" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arr-light)"/><path d="M250,198 L334,198" fill="none" stroke="#8E9BA1" stroke-width="1.4" marker-end="url(#arr-light)"/><path d="M564,190 L688,190" fill="none" stroke="#8E9BA1" stroke-width="1.4" marker-end="url(#arr-light)"/><text x="626.0" y="182.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5B6B72" text-anchor="middle">create / update</text><path d="M690,258 L566,262" fill="none" stroke="#8E9BA1" stroke-width="1.4" marker-end="url(#arr-light)"/><text x="628.0" y="252.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5B6B72" text-anchor="middle">read</text><path d="M564,284 L688,280" fill="none" stroke="#8E9BA1" stroke-width="1.4" marker-end="url(#arr-light)"/><text x="626.0" y="296.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5B6B72" text-anchor="middle">save to queries/</text><path d="M690,320 L566,336" fill="none" stroke="#8E9BA1" stroke-width="1.4" marker-end="url(#arr-light)"/><text x="628.0" y="320.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5B6B72" text-anchor="middle">scan</text><path d="M564,358 L688,346" fill="none" stroke="#8E9BA1" stroke-width="1.4" marker-end="url(#arr-light)"/><text x="626.0" y="366.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5B6B72" text-anchor="middle">report to lint/</text><text x="932" y="406" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8E9BA1" text-anchor="end">